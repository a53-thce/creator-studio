<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#C8384B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>自媒体创作工作台</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="icon" href="assets/img/mascot.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/img/mascot.png" />
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
<script>
(function(){
  try{
    var beacon=new BeaconAction({
      appkey:'0WEB06U85YBSLJNL',
      versionCode:'1.0.0',
      channelID:'share',
      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:false,
      needReportRqdEvent:false
    });
    beacon.onDirectUserAction('preview_page_view',{
      'url':location.href,
      'referrer':document.referrer,
      'title':document.title,
      'sandbox_id':'d9eaec7cdaba4e07af28be2415ed7126'
    });
  }catch(e){}
})();
</script></head>
<body>
<div class="app">

  <!-- 左侧纵向导航栏 -->
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="rail-logo">创</div>
      <div class="rail-brand-txt">工作台</div>
    </div>
    <nav class="rail-nav" id="railNav"></nav>
    <button class="rail-toggle" id="railToggle" title="展开/收起导航">
      <span class="rt-icon">»</span>
    </button>
  </aside>
  <div class="rail-mask" id="railMask"></div>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button class="tb-btn" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="tb-title">
        <h1 id="pageTitle">每日计划</h1>
        <p id="pageSub">今天也要好好生活呀</p>
      </div>
      <button class="tb-btn" id="refreshBtn" aria-label="刷新今日内容">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button class="tb-btn" id="favBtn" aria-label="收藏夹">
        <svg viewBox="0 0 24 24"><path d="M12 17.3l-6.2 3.7 1.7-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.5 4.8 1.7 7z"/></svg>
        <em class="tb-badge" id="favCount">0</em>
      </button>
    </header>

    <section class="view" id="view"></section>

    <footer class="footer">
      <span id="footNote">自媒体创作工作台 · 本地数据自动保存</span>
    </footer>
  </main>

  <!-- 收藏夹抽屉 -->
  <div class="sheet" id="favSheet">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h3>我的收藏夹</h3>
        <button class="sheet-close" id="favClose">×</button>
      </div>
      <div class="sheet-tabs" id="favTabs"></div>
      <div class="sheet-body" id="favBody"></div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div class="sheet" id="modal">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h3 id="modalTitle">详情</h3>
        <button class="sheet-close" id="modalClose">×</button>
      </div>
      <div class="sheet-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="assets/js/data-english.js"></script>
<script src="assets/js/data-content.js"></script>
<script src="assets/js/data-tcm.js"></script>
<script src="assets/js/data-videos.js"></script>
<script src="assets/js/data-daily.js" onerror="window.DAILY=null"></script>
<script src="assets/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    var __swReg = null;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        __swReg = reg;
        /* 注册后立即主动检查一次新版本（对已安装到主屏幕的独立 App 尤为关键） */
        try { reg.update(); } catch (e) {}
        /* 检测到新版本：标记后，待其接管时自动重载（最多每天一次，不弹窗打扰） */
        if (reg && reg.addEventListener) {
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing; if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                window.__swUpdated = true;
              }
            });
          });
        }
        /* 每小时主动轮询一次：补偿 iOS/Android 对已安装 PWA 的迟钝更新 */
        setInterval(function () { try { reg.update(); } catch (e) {} }, 60 * 60 * 1000);
      }).catch(function () {});
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing || !window.__swUpdated) return;
        refreshing = true; location.reload();
      });
    });
  }
</script>
</body>
</html>
